<title>Mi cuaderno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#C7DEF2; --bg-panel:#DCEAF7; --bg-card:#FFFFFF;
    --ink:#1B2A41; --ink-dim:#5E7290;
    --accent:#D9A441; --accent-dim:#8C6E2E;
    --line: rgba(27,42,65,0.22);
    --done:#2E7D5B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background: linear-gradient(180deg, #DCEAF7 0%, #BFDAF0 100%);
    color:var(--ink);
    font-family:'Inter',sans-serif;
  }
  header{
    display:flex; justify-content:space-between; align-items:center;
    padding:20px 32px; border-bottom:1px solid var(--line);
    background:var(--bg-panel);
  }
  header h1{
    font-family:'Space Mono',monospace; font-size:17px; margin:0;
    letter-spacing:0.02em;
  }
  #userTag{ font-size:12.5px; color:var(--ink-dim); }
  #logoutBtn{
    background:none; border:1px solid var(--line); color:var(--ink-dim);
    padding:7px 14px; border-radius:3px; font-size:12px; cursor:pointer;
    font-family:'Inter',sans-serif; margin-left:12px;
  }
  #logoutBtn:hover{ border-color:var(--accent); color:var(--accent); }
  .headRight{ display:flex; align-items:center; }
  main{ max-width:840px; margin:0 auto; padding:40px 24px 80px; }
  .progressBar{
    background:#FFFFFF; border:1px solid var(--line); border-radius:4px;
    padding:18px 22px; margin-bottom:32px; display:flex; align-items:center; gap:18px;
    box-shadow:0 2px 8px rgba(27,42,65,0.06);
  }
  .progressBar .num{ font-family:'Space Mono',monospace; font-size:26px; color:var(--accent); }
  .progressBar .track{ flex:1; height:8px; background:var(--bg); border-radius:4px; overflow:hidden; }
  .progressBar .fill{ height:100%; background:var(--accent); border-radius:4px; transition:width .4s; }
  .progressBar .label{ font-size:12.5px; color:var(--ink-dim); }
  h2.section{
    font-family:'Space Mono',monospace; font-size:13px; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--ink-dim); margin:34px 0 14px;
  }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
  .exCard{
    background:var(--bg-card); border:1px solid var(--line); border-radius:4px;
    padding:18px; text-decoration:none; color:var(--ink); position:relative;
    display:block; transition:border-color .15s; box-shadow:0 2px 8px rgba(27,42,65,0.06);
  }
  .exCard:hover{ border-color:var(--accent); }
  .exCard.done{ border-color:var(--done); }
  .exCard.locked{ opacity:0.45; cursor:default; }
  .exCard.locked:hover{ border-color:var(--line); }
  .exCard .stamp{
    position:absolute; top:14px; right:14px; font-size:16px;
  }
  .exCard .name{ font-weight:600; font-size:14.5px; margin:0 0 4px; padding-right:24px; }
  .exCard .cat{ font-size:11.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.05em; }
  .empty{ color:var(--ink-dim); font-size:13.5px; padding:20px 0; }
</style>
</head>
<body>
<header>
  <h1>JohnPeter <span style="color:var(--ink-dim); font-weight:400;">· Cuaderno de ejercicios</span></h1>
  <div class="headRight">
    <span id="userTag"></span>
    <a href="admin.html" id="adminLink" style="display:none; text-decoration:none; background:none; border:1px solid var(--line); color:var(--accent); padding:7px 14px; border-radius:3px; font-size:12px; margin-left:12px; font-family:'Space Mono',monospace;">Panel admin</a>
    <button id="logoutBtn">Salir</button>
  </div>
</header>

<main>
  <div class="progressBar">
    <div class="num" id="pctNum">0%</div>
    <div>
      <div class="track"><div class="fill" id="pctFill" style="width:0%"></div></div>
      <div class="label" id="pctLabel">0 de 0 ejercicios completados</div>
    </div>
  </div>

  <div id="sections"></div>
</main>

    { id:"n6-18", name:"Conectores académicos", cat:"Nivel 6 · Avanzado (C1)", url:"ejercicios/engine.html?id=n6-18", available:true },
    { id:"n6-19", name:"Estructuras enfáticas", cat:"Nivel 6 · Avanzado (C1)", url:"ejercicios/engine.html?id=n6-19", available:true },
    { id:"n6-20", name:"Subjunctive en inglés formal", cat:"Nivel 6 · Avanzado (C1)", url:"ejercicios/engine.html?id=n6-20", available:true },
    { id:"n6-21", name:"Impersonal passive", cat:"Nivel 6 · Avanzado (C1)", url:"ejercicios/engine.html?id=n6-21", available:true },
  ];

  (async () => {
    const session = await requireSession();
    if (!session) return;

    document.getElementById("userTag").textContent = session.user.email;
    document.getElementById("logoutBtn").onclick = signOut;

    // Mostrar el botón de panel admin solo si el usuario tiene ese rol
    const profile = await getMyProfile();
    if (profile && profile.role === "admin") {
      document.getElementById("adminLink").style.display = "inline-block";
    }

    const myProgress = await getMyProgress();
    const doneIds = new Set(myProgress.map(p => p.exercise_id));

    // Barra de progreso
    const pct = EXERCISES.length ? Math.round((doneIds.size / EXERCISES.length) * 100) : 0;
    document.getElementById("pctNum").textContent = pct + "%";
    document.getElementById("pctFill").style.width = pct + "%";
    document.getElementById("pctLabel").textContent = `${doneIds.size} de ${EXERCISES.length} ejercicios completados`;

    // Agrupar por categoría
    const byCat = {};
    EXERCISES.forEach(ex => {
      byCat[ex.cat] = byCat[ex.cat] || [];
      byCat[ex.cat].push(ex);
    });

    const container = document.getElementById("sections");
    if (EXERCISES.length === 0) {
      container.innerHTML = `<p class="empty">Aún no hay ejercicios cargados. Tu profesor los añadirá pronto.</p>`;
      return;
    }

    Object.entries(byCat).forEach(([cat, list]) => {
      const section = document.createElement("div");
      const done = list.filter(ex => doneIds.has(ex.id)).length;
      section.innerHTML = `<h2 class="section">${cat} — ${done}/${list.length}</h2>`;
      const grid = document.createElement("div");
      grid.className = "grid";
      list.forEach(ex => {
        const isDone = doneIds.has(ex.id);
        const locked = ex.available === false;
        const a = document.createElement(locked ? "div" : "a");
        if (!locked) {
          a.href = ex.url;
          a.rel = "noopener";
        }
        a.className = "exCard" + (isDone ? " done" : "") + (locked ? " locked" : "");
        a.innerHTML = `
          <div class="stamp">${locked ? "🔒" : (isDone ? "✓" : "→")}</div>
          <p class="name">${ex.name}</p>
          <div class="cat">${locked ? "Próximamente" : (isDone ? "Completado" : "Pendiente")}</div>
        `;
        grid.appendChild(a);
      });
      section.appendChild(grid);
      container.appendChild(section);
    });
  })();
</script>
</body>
