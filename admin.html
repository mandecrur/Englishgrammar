<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel del profesor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#E9F1FA; --bg-panel:#F5FAFE; --bg-card:#FFFFFF;
    --ink:#1B2A41; --ink-dim:#5E7290;
    --accent:#D9A441;
    --line: rgba(27,42,65,0.12);
    --done:#2E7D5B; --danger:#C0392B;
  }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background: linear-gradient(180deg, #F5FAFE 0%, #E4EFFA 100%); color:var(--ink); font-family:'Inter',sans-serif; }
  header{
    display:flex; justify-content:space-between; align-items:center;
    padding:20px 32px; border-bottom:1px solid var(--line); background:var(--bg-panel);
  }
  header h1{ font-family:'Space Mono',monospace; font-size:17px; margin:0; }
  header .badge{
    font-family:'Space Mono',monospace; font-size:10px; background:var(--accent);
    color:#16261F; padding:3px 8px; border-radius:2px; margin-left:10px; vertical-align:middle;
  }
  #logoutBtn{
    background:none; border:1px solid var(--line); color:var(--ink-dim);
    padding:7px 14px; border-radius:3px; font-size:12px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  #logoutBtn:hover{ border-color:var(--accent); color:var(--accent); }
  main{ max-width:960px; margin:0 auto; padding:36px 24px 80px; }
  .denied{ text-align:center; padding:80px 20px; color:var(--ink-dim); }
  table{ width:100%; border-collapse:collapse; background:var(--bg-card); border:1px solid var(--line); border-radius:4px; overflow:hidden; }
  th, td{ text-align:left; padding:12px 16px; font-size:13.5px; border-bottom:1px solid var(--line); }
  th{
    font-family:'Space Mono',monospace; font-size:10.5px; text-transform:uppercase;
    letter-spacing:0.06em; color:var(--ink-dim); background:var(--bg-panel);
  }
  tr:last-child td{ border-bottom:none; }
  .pctCell{ display:flex; align-items:center; gap:10px; }
  .miniTrack{ width:80px; height:6px; background:var(--bg); border-radius:3px; overflow:hidden; }
  .miniFill{ height:100%; background:var(--accent); }
  .role{
    font-family:'Space Mono',monospace; font-size:10px; padding:2px 7px; border-radius:2px;
    background:rgba(217,164,65,0.15); color:var(--accent);
  }
  .summary{ display:flex; gap:16px; margin-bottom:24px; }
  .stat{
    background:var(--bg-card); border:1px solid var(--line); border-radius:4px; padding:16px 20px; flex:1;
  }
  .stat .n{ font-family:'Space Mono',monospace; font-size:24px; color:var(--accent); }
  .stat .l{ font-size:11.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.05em; margin-top:4px; }
</style>
</head>
<body>
<header>
  <h1>Cuaderno de ejercicios <span class="badge">ADMIN</span></h1>
  <button id="logoutBtn">Salir</button>
</header>

<main id="main">
  <p style="color:var(--ink-dim);font-size:13px;">Cargando...</p>
</main>

<script src="shared/supabase-client.js"></script>
<script>
  // Debe coincidir con el número total de ejercicios en dashboard.html (temario completo)
  const TOTAL_EXERCISES = 116;

  (async () => {
    const session = await requireSession();
    if (!session) return;
    document.getElementById("logoutBtn").onclick = signOut;

    const profile = await getMyProfile();
    const main = document.getElementById("main");

    if (!profile || profile.role !== "admin") {
      main.innerHTML = `<div class="denied">
        <p>No tienes permisos de administrador en esta cuenta.</p>
        <p style="font-size:12.5px;">Si eres el profesor, marca tu usuario como 'admin' en Supabase (ver README).</p>
      </div>`;
      return;
    }

    const [students, allProgress] = await Promise.all([
      adminGetAllStudents(),
      adminGetAllProgress()
    ]);

    const progressByUser = {};
    allProgress.forEach(p => {
      progressByUser[p.user_id] = progressByUser[p.user_id] || [];
      progressByUser[p.user_id].push(p);
    });

    const studentsOnly = students.filter(s => s.role !== "admin");
    const avgPct = studentsOnly.length
      ? Math.round(
          studentsOnly.reduce((sum, s) => {
            const done = (progressByUser[s.id] || []).length;
            return sum + (TOTAL_EXERCISES ? done / TOTAL_EXERCISES : 0);
          }, 0) / studentsOnly.length * 100
        )
      : 0;

    let rows = "";
    studentsOnly.forEach(s => {
      const done = (progressByUser[s.id] || []).length;
      const pct = TOTAL_EXERCISES ? Math.round((done / TOTAL_EXERCISES) * 100) : 0;
      rows += `
        <tr>
          <td>${s.full_name || "(sin nombre)"} ${s.role === "admin" ? '<span class="role">admin</span>' : ""}</td>
          <td>${s.id.slice(0,8)}...</td>
          <td>
            <div class="pctCell">
              <div class="miniTrack"><div class="miniFill" style="width:${pct}%"></div></div>
              <span>${done}/${TOTAL_EXERCISES}</span>
            </div>
          </td>
        </tr>`;
    });

    main.innerHTML = `
      <div class="summary">
        <div class="stat"><div class="n">${studentsOnly.length}</div><div class="l">Alumnos</div></div>
        <div class="stat"><div class="n">${avgPct}%</div><div class="l">Progreso promedio</div></div>
        <div class="stat"><div class="n">${allProgress.length}</div><div class="l">Ejercicios completados (total)</div></div>
      </div>
      <table>
        <thead>
          <tr><th>Alumno</th><th>ID</th><th>Progreso</th></tr>
        </thead>
        <tbody>${rows || `<tr><td colspan="3" style="color:var(--ink-dim);">Aún no hay alumnos dados de alta.</td></tr>`}</tbody>
      </table>
      <p style="font-size:12px;color:var(--ink-dim);margin-top:18px;">
        Para dar de alta un alumno: Supabase → Authentication → Users → Add user.
      </p>
    `;
  })();
</script>
</body>
</html>
