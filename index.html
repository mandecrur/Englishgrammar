<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academia · Acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#E9F1FA;
    --bg-panel:#F5FAFE;
    --ink:#1B2A41;
    --ink-dim:#5E7290;
    --accent:#D9A441;
    --accent-dim:#8C6E2E;
    --line: rgba(27,42,65,0.12);
    --danger:#C0392B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(180deg, #F5FAFE 0%, #E4EFFA 100%);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    padding:24px;
  }
  .card{
    width:100%;
    max-width:400px;
    background:#FFFFFF;
    border:1px solid var(--line);
    border-radius:6px;
    padding:40px 36px;
    position:relative;
    box-shadow: 0 10px 40px rgba(27,42,65,0.08);
  }
  .stamp{
    position:absolute;
    top:-14px;
    right:28px;
    background:var(--accent);
    color:#16261F;
    font-family:'Space Mono',monospace;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.06em;
    padding:5px 10px;
    border-radius:2px;
    transform:rotate(3deg);
  }
  h1{
    font-family:'Space Mono',monospace;
    font-size:22px;
    letter-spacing:0.02em;
    margin:0 0 6px;
  }
  .sub{
    color:var(--ink-dim);
    font-size:13.5px;
    margin:0 0 28px;
    line-height:1.5;
  }
  label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-dim);
    margin:0 0 6px;
  }
  input{
    width:100%;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--ink);
    padding:11px 12px;
    border-radius:3px;
    font-size:14px;
    font-family:'Inter',sans-serif;
    margin-bottom:18px;
  }
  input:focus{
    outline:none;
    border-color:var(--accent);
  }
  button{
    width:100%;
    background:var(--accent);
    color:#16261F;
    border:none;
    padding:12px;
    font-family:'Space Mono',monospace;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.04em;
    border-radius:3px;
    cursor:pointer;
    text-transform:uppercase;
  }
  button:hover{background:#e6b654;}
  button:disabled{opacity:0.6;cursor:default;}
  .msg{
    margin-top:16px;
    font-size:13px;
    padding:10px 12px;
    border-radius:3px;
    display:none;
    line-height:1.4;
  }
  .msg.error{
    display:block;
    background:rgba(193,102,107,0.15);
    color:#E7A2A6;
    border:1px solid rgba(193,102,107,0.3);
  }
  .foot{
    margin-top:22px;
    font-size:12px;
    color:var(--ink-dim);
    text-align:center;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="stamp">Acceso privado</div>
    <h1>Cuaderno de ejercicios</h1>
    <p class="sub">Ingresa con la cuenta que tu profesor creó para ti.</p>

    <form id="loginForm">
      <label for="email">Correo</label>
      <input type="email" id="email" required autocomplete="email">

      <label for="password">Contraseña</label>
      <input type="password" id="password" required autocomplete="current-password">

      <button type="submit" id="submitBtn">Entrar</button>
    </form>

    <div class="msg error" id="errMsg"></div>
    <p class="foot">¿No tienes cuenta? Pídele a tu profesor que te dé de alta.</p>
  </div>

<script src="shared/supabase-client.js"></script>
<script>
  const form = document.getElementById("loginForm");
  const errMsg = document.getElementById("errMsg");
  const submitBtn = document.getElementById("submitBtn");

  // Si ya hay sesión activa, saltar directo al panel
  client.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = "dashboard.html";
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errMsg.style.display = "none";
    submitBtn.disabled = true;
    submitBtn.textContent = "Entrando...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { error } = await client.auth.signInWithPassword({ email, password });

    if (error) {
      errMsg.textContent = "Correo o contraseña incorrectos. Verifica con tu profesor.";
      errMsg.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = "Entrar";
      return;
    }

    window.location.href = "dashboard.html";
  });
</script>
</body>
</html>
